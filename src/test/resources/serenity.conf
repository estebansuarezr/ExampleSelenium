headless.mode = true
webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [ "start-maximized", "incognito", "test-type", "no-sandbox", "disable-popup-blocking",
        "disable-download-notification", "ignore-certificate-errors", "disable-notifications", "allow-running-insecure-content", "disable-translate",
        "always-authorize-plugins", "disable-extensions", "disable-infobars", "disable-gpu", "disable-dev-shm-usage", "remote-allow-origins=*"]
    }
  }
}
serenity.browser.maximized = true

serenity {
  encoding = "UTF-8"
  compress.filenames = true
  take.screenshots = FOR_EACH_ACTION
  restart.browser.for.each = scenario
}

environments {
  default {
    webdriver.base.url = ""
  }
  dev {
    webdriver.base.url = ""
  }
  staging {
    webdriver.base.url = ""
  }
}