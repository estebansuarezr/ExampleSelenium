defaultTasks 'clean','test','aggregate'

group = 'com.arreglatech.project'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath("net.serenity-bdd:serenity-gradle-plugin:4.0.15")
    }
}

apply plugin: "net.serenity-bdd.serenity-gradle-plugin"


java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

compileJava { options.encoding = "UTF-8" }
compileTestJava { options.encoding = "UTF-8" }

ext {
    serenityVersion = '4.0.15'
    slf4jVersion = '2.0.9'
    assertjCoreVersion = '3.24.2'
    junitVersion = '4.13.1'
}

dependencies {

    implementation "net.serenity-bdd:serenity-core:${serenityVersion}",
            "net.serenity-bdd:serenity-cucumber:${serenityVersion}",
            "net.serenity-bdd:serenity-screenplay:${serenityVersion}",
            "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"

    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}",
            "junit:junit:${junitVersion}",
            "org.assertj:assertj-core:${assertjCoreVersion}",
            "org.slf4j:slf4j-simple:${slf4jVersion}"

}

test {
    systemProperties System.getProperties()
    testLogging.showStandardStreams = true
}

serenity {
    testRoot = "com.arreglatech.project.runners"
    requirementsBaseDir = "src/test/resources/features"
}

gradle.startParameter.continueOnFailure = true

test.finalizedBy(aggregate)